appId: com.nevh.drama
productName: Nevh Drama
directories:
  output: release
  buildResources: build
# Main-process output + backend bundle + manifest (packed into asar).
# backend.mjs must stay inside asar: its externals (sharp/better-sqlite3) resolve upward
# via createRequire to app.asar/node_modules (.node files are redirected by Electron to app.asar.unpacked)
files:
  - dist/**
  - build/backend.mjs
  - package.json
# Native modules cannot stay in asar (.node needs a real file path for dlopen)
asarUnpack:
  - "**/node_modules/sharp/**"
  - "**/node_modules/@img/**"
  - "**/node_modules/better-sqlite3/**"
extraResources:
  - { from: resources/frontend, to: frontend }
  - { from: resources/workspace-template, to: workspace-template }
  # ${os} macro: darwin -> bin-darwin/ (binaries without extensions), win32 -> bin-win32/ (.exe);
  # each package includes only its own platform's ffmpeg/ffprobe
  - { from: "resources/bin-${os}", to: bin }
npmRebuild: true
# Windows cross-build fix: native prebuilts downloaded on the host (mac) are Mach-O; afterPack swaps in the official win32 .node
afterPack: scripts/after-pack.mjs
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    # Zip artifact for the in-app updater (.app directory archive), produced alongside the dmg
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.productivity
  # Unsigned build first: distribution requires Apple Developer signing + notarization (config slot kept)
  identity: null
  icon: assets/icon.icns
win:
  target:
    - target: nsis
      arch: [x64]
  # signExecutable:false only skips signing (SmartScreen warns for unsigned distribution);
  # icon and version info are still written to the exe. Distribution requires a code-signing certificate
  signExecutable: false
  icon: assets/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: Nevh Drama
