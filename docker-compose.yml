# Huobao Drama all-in-one Docker deployment: app + Watchtower (pulls new images and recreates containers automatically, enabling in-app one-click updates)
#
# Usage:
#   1. Copy .env.example to .env and edit WATCHTOWER_TOKEN (both sides must match)
#   2. docker compose up -d
#   3. Open http://localhost:5679; the Settings page has an About/Updates section for checking and applying updates
#
# Data persists in the named volume huobao-data (SQLite + generated images/videos + editable workspace/skills).

services:
  app:
    image: huobao/huobao-drama:latest
    build:
      context: .
      args:
        # Version injected at build time (set for release images, e.g. HUOBAO_VERSION=1.2.0)
        HUOBAO_VERSION: ${HUOBAO_VERSION:-dev}
    ports:
      - "5679:5679"
    environment:
      # Once configured, the Settings page shows an About/Updates section with an Update Now button; remove these two lines to fall back to a manual update hint
      HUOBAO_WATCHTOWER_URL: http://watchtower:8080
      HUOBAO_WATCHTOWER_TOKEN: ${WATCHTOWER_TOKEN:-please-change-me}
      # Release manifest (GitHub Releases latest.json by default, shared with the desktop app)
      # HUOBAO_UPDATE_FEED: https://github.com/gudangcoding/nevh_drama_ai/releases/latest/download/latest.json
    volumes:
      - huobao-data:/app/data
    labels:
      # Watchtower --label-enable: only update containers explicitly labeled for it
      com.centurylinklabs.watchtower.enable: "true"
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower:latest
    command: >
      --http-api-update
      --http-api-token ${WATCHTOWER_TOKEN:-please-change-me}
      --label-enable
      --cleanup
      --rolling-restart
      --interval 86400
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  huobao-data:
